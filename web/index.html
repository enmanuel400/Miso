<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` deja que la interfaz llegue bajo la muesca y la
         barra inferior; CSS repone el hueco con las variables safe-area. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08080a" />
    <title>Miso</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Instalacion en la pantalla de inicio. Android usa el manifest; iOS
         todavia mira estas etiquetas. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Miso" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
